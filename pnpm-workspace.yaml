packages:
  - apps/*
  - packages/*

nodeLinker: isolated
preferSymlinkedExecutables: true
shellEmulator: true
autoInstallPeers: false
injectWorkspacePackages: false
dedupeInjectedDeps: false

syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@ykdz/template"
  # 仅豁免本轮固定版本，后续版本仍遵循发布时间门槛。
  - "@lioni/lioni@0.2.3"

allowBuilds:
  esbuild: true

catalog:
  "@lioni/lioni": 0.2.3
  "@types/node": ^24.13.3
  fflate: 0.8.3
  "oxfmt": ^0.74.0
  "oxlint": ^1.89.0
  "oxlint-tsgolint": ^7.0.2001
  parse5: 8.0.1
  "turbo": 2.11.10
  "typescript-7": npm:typescript@^7.0.2
  "valibot": ^1.4.2
  yaml: 2.9.1
  zod: 4.6.7
