format: lands-l10n-project/v1
resources:
  - path: META-INF/MANIFEST.MF
    purpose: metadata
  - path: README.md
    purpose: documentation
  - path: categories.yml
    purpose: configuration
  - path: changelog.txt
    purpose: documentation
  - path: config.yml
    purpose: configuration
  - path: events.yml
    purpose: configuration
  - path: levels.yml
    purpose: configuration
  - path: player-limits.yml
    purpose: configuration
  - path: plugin.yml
    purpose: metadata
  - path: roles.yml
    purpose: configuration
  - path: server-name.yml
    purpose: configuration
  - path: web.yml
    purpose: configuration
  - path: Locale/definitions_gui-bedrock.yml
    purpose: bedrock-excluded
  - path: Locale/definitions_gui.yml
    purpose: configuration
  - path: Locale/en-US.yml
    purpose: chat-language
  - path: Locale/en-US_dialogs.yml
    purpose: dialog-language
  - path: Locale/en-US_gui-bedrock.yml
    purpose: bedrock-excluded
  - path: Locale/en-US_gui.yml
    purpose: gui-language
  - path: Locale/theme.yml
    purpose: configuration
  - path: Locale/Nations/definitions_gui.yml
    purpose: configuration
  - path: Locale/Nations/en-US.yml
    purpose: chat-language
  - path: Locale/Nations/en-US_dialogs.yml
    purpose: dialog-language
  - path: Locale/Nations/en-US_gui.yml
    purpose: gui-language
  - path: Locale/Wars/definitions_gui.yml
    purpose: configuration
  - path: Locale/Wars/en-US.yml
    purpose: chat-language
  - path: Locale/Wars/en-US_gui.yml
    purpose: gui-language
  - path: Modules/Nations/nations.yml
    purpose: configuration
  - path: Modules/RandomTeleport/rtp.yml
    purpose: configuration
  - path: Modules/Wars/modes.yml
    purpose: configuration
  - path: Modules/Wars/wars.yml
    purpose: configuration
translationScope:
  sourceLanguage: "en-US"
  targetLanguage: "zh-CN"
  mappings:
    - source: Locale/en-US.yml
      target: Locale/zh-CN.yml
      fields:
        - path: [general]
          category: chat-string
        - path: [help]
          category: chat-string
        - path: [lands]
          category: chat-string
        - path: [list, "**"]
          category: chat-string-list
    - source: Locale/Nations/en-US.yml
      target: Locale/Nations/zh-CN.yml
      fields:
        - path: [general]
          category: chat-string
        - path: [nations]
          category: chat-string
        - path: [help]
          category: chat-string
        - path: [lands]
          category: chat-string
    - source: Locale/Wars/en-US.yml
      target: Locale/Wars/zh-CN.yml
      fields:
        - path: [general]
          category: chat-string
        - path: [wars]
          category: chat-string
        - path: [help]
          category: chat-string
        - path: [lands]
          category: chat-string
        - path: [nations]
          category: chat-string
    - source: Locale/en-US_dialogs.yml
      target: Locale/zh-CN_dialogs.yml
      definitionsSource: Locale/en-US_dialogs.yml
      fields:
        - path: [value, confirm]
          category: chat-string
        - path: [dialogs, "*", title]
          category: dialog-string
          scene: dialog-title
        - path: [dialogs, "*", buttons, "*", label]
          category: dialog-string
          scene: dialog-button-label
        - path: [dialogs, "*", buttons, "*", tooltip]
          category: dialog-string
          scene: dialog-button-tooltip
        - path: [dialogs, "*", inputs, "*", label]
          category: dialog-string
          scene: dialog-input-label
        - path: [dialogs, "*", inputs, "*", label-format]
          category: dialog-label-format
          scene: dialog-label-format
        - path: [dialogs, "*", bodies, "*", text]
          category: dialog-string
          scene: dialog-body-text
        - path: [dialogs, "*", bodies, "*", item, name]
          category: gui-string
          scene: gui-item-name
        - path: [dialogs, "*", bodies, "*", item, lore]
          category: gui-lore
          scene: gui-item-lore
    - source: Locale/Nations/en-US_dialogs.yml
      target: Locale/Nations/zh-CN_dialogs.yml
      definitionsSource: Locale/Nations/en-US_dialogs.yml
      fields:
        - path: [dialogs, "*", title]
          category: dialog-string
          scene: dialog-title
        - path: [dialogs, "*", buttons, "*", label]
          category: dialog-string
          scene: dialog-button-label
        - path: [dialogs, "*", buttons, "*", tooltip]
          category: dialog-string
          scene: dialog-button-tooltip
        - path: [dialogs, "*", inputs, "*", label]
          category: dialog-string
          scene: dialog-input-label
        - path: [dialogs, "*", inputs, "*", label-format]
          category: dialog-label-format
          scene: dialog-label-format
        - path: [dialogs, "*", bodies, "*", text]
          category: dialog-string
          scene: dialog-body-text
        - path: [dialogs, "*", bodies, "*", item, name]
          category: gui-string
          scene: gui-item-name
        - path: [dialogs, "*", bodies, "*", item, lore]
          category: gui-lore
          scene: gui-item-lore
    - source: Locale/en-US_gui.yml
      target: Locale/zh-CN_gui.yml
      definitionsSource: Locale/definitions_gui.yml
      fields:
        - path: [general, "**"]
          category: gui-string
          scene: gui-general
        - path: [common, items, default, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [common, items, default, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [physical, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [physical, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [gui, "*", title]
          category: gui-string
          scene: gui-title
        - path: [gui, "*", items, "*", "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [gui, "*", items, "*", "*", lore]
          category: gui-lore
          scene: gui-item-lore
    - source: Locale/Nations/en-US_gui.yml
      target: Locale/Nations/zh-CN_gui.yml
      definitionsSource: Locale/Nations/definitions_gui.yml
      fields:
        - path: [general, "**"]
          category: gui-string
          scene: gui-general
        - path: [common, items, default, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [common, items, default, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [physical, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [physical, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [gui, "*", title]
          category: gui-string
          scene: gui-title
        - path: [gui, "*", items, "*", "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [gui, "*", items, "*", "*", lore]
          category: gui-lore
          scene: gui-item-lore
    - source: Locale/Wars/en-US_gui.yml
      target: Locale/Wars/zh-CN_gui.yml
      definitionsSource: Locale/Wars/definitions_gui.yml
      fields:
        - path: [general, "**"]
          category: gui-string
          scene: gui-general
        - path: [common, items, default, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [common, items, default, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [physical, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [physical, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [gui, "*", title]
          category: gui-string
          scene: gui-title
        - path: [gui, "*", items, "*", "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [gui, "*", items, "*", "*", lore]
          category: gui-lore
          scene: gui-item-lore
    - source: categories.yml
      target: categories.yml
      definitionsSource: categories.yml
      fields:
        - path: [land, categories, "*", name]
          category: configuration-string
          scene: category-name
        - path: [land, categories, "*", description]
          category: configuration-string-list
          scene: category-description
    - source: roles.yml
      target: roles.yml
      definitionsSource: roles.yml
      fields:
        - path: [land, roles, "*", name]
          category: configuration-string
          scene: role-name
