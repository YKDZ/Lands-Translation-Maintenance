name: Lands
main: me.angeschossen.lands.Lands
version: 8.9.2
author: 'Angeschossen'
description: 'Feature rich GUI, Taxes, Customize your own, Titles, New factions - Let players manage their land!'
website: 'https://www.spigotmc.org/resources/53313'
api-version: '1.13'
load: POSTWORLD
folia-supported: true

softdepend: [ WorldGuard, MobHunting, BlueMap, WildRegeneration ]

libraries:
  - "org.redisson:redisson:3.48.0"
  - "org.apache.commons:commons-lang3:3.17.0"
  - "com.zaxxer:HikariCP:4.0.3"
  - "org.slf4j:slf4j-jdk14:1.7.32"
  - "org.slf4j:slf4j-api:1.7.32"
  - "net.kyori:adventure-api:4.26.1"
  - "net.kyori:adventure-text-minimessage:4.26.1"
  - "net.kyori:adventure-text-serializer-legacy:4.26.1"
  - "net.kyori:adventure-text-serializer-plain:4.26.1"
  - "net.kyori:adventure-text-serializer-gson:4.26.1"

commands:
  lands:
    description: 'Claim land and manage it in a useful GUI menu.'
    aliases:
      - land
  nations:
    description: 'Create a nation and invite other lands to join you.'
    aliases:
      - nation
  claim:
    description: 'Quickly create your own land named after you and claim your current chunk.'
  view:
    description: 'Show info about the land at your current location.'
  unclaim:
    description: 'Unclaim your current chunk (also supports radius/auto).'
  trust:
    description: 'Trust a player in your land.'
  untrust:
    description: 'Untrust a player from your land.'
  assign:
    description: 'Assign your current selection as an area, auto-creating it if it does not exist yet.'
  selection:
    description: 'Turn selection mode on or off.'

permissions:
  lands.*:
    description: Access to all Lands actions
    children:
      lands.command.*:
        description: Access to all player commands
        children:
          lands.command.area:
            description: /lands area
            children:
              lands.command.area.menu:
                description: /lands area <area> menu
              lands.command.area.assign:
                description: /lands area <area> assign (also available as /assign)
              lands.command.area.create:
                description: /lands area <name> create
              lands.command.area.rental:
                description: /lands area <area> rental
                children:
                  lands.command.area.rental.info:
                    description: /lands area <area> rental info
                  lands.command.area.rental.remove:
                    description: /lands area <area> rental remove
                    children:
                      lands.command.area.rental.remove.offer:
                        description: Remove a rental/sale offer.
                      lands.command.area.rental.remove.tenant:
                        description: Forcefully remove tenants from their area.
              lands.command.area.member:
                description: /lands area <area> member
                children:
                  lands.command.area.member.menu:
                    description: /lands area <area> member menu
                  lands.command.area.member.setrole:
                    description: /lands area <area> member setrole
                  lands.command.area.member.trust:
                    description: /lands area <area> member trust
                  lands.command.area.member.untrust:
                    description: /lands area <area> member untrust
                  lands.command.area.member.ban:
                    description: /lands area <area> member ban
                  lands.command.area.member.unban:
                    description: /lands area <area> member unban
              lands.command.area.spawn:
                description: /lands area <area> spawn
                children:
                  lands.command.area.spawn.set:
                    description: /lands area <area> spawn set
                  lands.command.area.spawn.teleport:
                    description: Teleport to an area's spawn via /lands area <area> spawn.
