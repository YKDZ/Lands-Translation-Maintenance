      lands.admin.*:
        description: Access to all admin actions. Commands are executed directly against any land via /lands edit <land>, bypassing ownership and trust checks.
        children:
          lands.admin.disabled-features:
            description: Allow to use disabled features such as setting areas up for rental or claim in worlds where claiming was disabled for regular players in config.yml.
          lands.admin.command.edit:
            description: Allow to manage any land via /lands edit <land>, even if not a member. This may also ignore requirements such as max members for some commands.
          lands.admin.land_delete:
            description: Allow to delete other lands or unclaim chunks from other lands.
          lands.admin.land_setowner:
            description: Allow the usage of /lands setowner for lands the player doesn't own
          lands.admin.setting_edit_land:
            description: Edit land settings of other lands (like mob spawning etc.)
          lands.admin.setting_edit_role:
            description: Edit role settings of other lands.
          lands.admin.setting_edit_taxes:
