nations:
  message:
    current-war: <t:error>You can't do this right now. <t:regular>Your nation<t:entity_nation> <v:nation></t> is currently engaged in a war. <t:regular>Please try again after the war is over.
    untrusted: <t:error>You're not a member of nation<t:error_value> <v:nation></t>.
