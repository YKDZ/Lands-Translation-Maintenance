        capital: <t:error>You can't remove this land. <t:regular>Land<t:entity_land> <v:land></t> is the capital of nation<t:entity_nation> <v:nation></t>.
        already: <t:error>Land<t:error_value> <v:land></t> isn't a member of nation<t:error_value> <v:nation></t>.
        success: <t:regular>You successfully removed land<t:entity_land> <v:land></t> from nation<t:entity_nation> <v:nation></t>.
        noaccess: '<t:error>You''re not allowed to do this for nation<t:error_value> <v:nation></t>. <t:decoration>Flag: </t><t:regular_value><v:flag></t>'
