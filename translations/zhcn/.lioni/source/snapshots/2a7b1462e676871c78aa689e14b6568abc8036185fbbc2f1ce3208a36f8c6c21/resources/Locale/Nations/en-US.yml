    general:
      none: |
        <t:error>Your land<t:error_value> <v:land></t> isn't part of any nation.

          <t:regular>Any nation can invite your land: <t:cmd>/<v:cmd_trust>
          </t><hover:show_text:"<t:regular>Click to copy."><click:suggest_command:"/<v:cmd>"><t:regular>Create your own nation: <t:cmd>/<v:cmd> </t><java><t:click>[CLICK]</t></java></click></hover>
    create:
      camp: |
        <t:error>You can't create a nation with a camp <t:decoration>(</t><t:error_value><v:land></t>) <t:error>as the capital.
          <hover:show_text:"<t:regular>Create a land. Click to copy."><click:suggest_command:"/<v:cmd_create>"><t:regular>✖ Create land: <t:cmd>/<v:cmd_create> </t><java><t:click>[CLICK]</t></java></click></hover>
