# In this file you can configure categories. Land categories can be set
# in the various options menu of a land. This helps players finding
# for example shop lands in the /lands list menu.
#
# You can add your own categories and delete existing ones.
# NOTE: A server reload or restart is required for any changes of this file to take effect.
#
# Set "default: true" on a category to have new lands start with that category
# instead of none. At most one category should be marked as default; if several
# are, only the first one found is used and the rest are ignored.

land:
  enabled: true
  categories:
    members:
      enabled: true
      default: false
      # Allow land owners to enable a option to automatically accept new membership requests.
      # If set to false, the option is also disabled for existing lands, when the server is restarted.
      allow-auto-accept: true
      name: '&eLooking for Members ☺'
      description:
        - '&7This land is actively searching'
        - '&7for new members.'
    shop:
      enabled: true
      default: false
      name: '&cShop $'
      description:
        - '&7This land contains shops.'
    pvp:
      enabled: true
      default: false
      name: '&4PvP Arena ⚔'
      description:
        - '&7This land features a PvP arena.'
    mobfarm:
      enabled: true
      default: false
      name: '&9Mobfarm'
      description:
        - '&7This land features a mobfarm.'
