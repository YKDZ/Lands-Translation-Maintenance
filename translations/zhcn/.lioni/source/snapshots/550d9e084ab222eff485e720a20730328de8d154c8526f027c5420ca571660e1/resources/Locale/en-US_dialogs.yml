dialogs:
  confirm:
    title: Confirm
    bodies:
      info:
        text: <v:message>
    buttons:
      confirm:
        label: <t:positive>Confirm
        tooltip: Click here to confirm.
      discard:
        label: <t:negative>Cancel
        tooltip: Click to cancel.
  input:
    title: Input
    inputs:
      text:
        label: Text
      player:
        label: Player
    buttons:
      confirm:
        label: <t:positive>Confirm
        tooltip: Click here to confirm your input.
      discard:
        label: <t:negative>Discard
        tooltip: Click to discard your input.
  add_member:
    title: Add Player
    inputs:
      name:
        label: Player
    buttons:
      add:
        label: <t:positive>Add
        tooltip: Trust this player permanently.
      add-temporary:
        label: <t:regular_value>Add temporarily
        tooltip: Trust this player for a limited time.
      discard:
        label: <t:negative>Discard
        tooltip: Click to discard.
  add_member_duration:
    title: Temporary trust
    inputs:
      days:
        type: number-range
        label: Days
        label-format: '<v:label>: <v:value>'
        start: 0
        end: 30
        step: 1
        initial: 0
      hours:
        type: number-range
        label: Hours
        label-format: '<v:label>: <v:value>'
        start: 0
        end: 23
        step: 1
        initial: 0
    bodies:
      info:
        text: The player will be trusted only for the selected duration. A temporarily-trusted
          player doesn't pay taxes and can't claim or unclaim unless they're also permanently
          trusted in another area.
    buttons:
      add:
        label: <t:positive>Add
        tooltip: Trust this player for the selected duration.
      back:
        label: <t:regular>Back
        tooltip: Go back.
  land_create:
    title: Create a New Land
    inputs:
      name:
        label: Name
      tag:
        label: Tag
    bodies:
      info:
        text: Creating this land will cost you<t:cost> <v:cost></t>. For
          your new land<t:regular_value> <v:chunks></t> chunks will be claimed,
          if there is enough space.
      tag:
        text: The tag is the short version of your land's name.
        item:
          material: NAME_TAG
          hide-tooltip: true
    buttons:
      confirm:
        label: <t:positive>Create
        tooltip: Click here to create a new land.
      discard:
        label: <t:negative>Discard
        tooltip: Click to discard the land creation.
value:
  # Command confirmations, by the key of their chat message. Without a text here the command confirms in chat.
  confirm:
    general:
      input:
        confirm: <t:regular>Run <t:cmd>/<v:input></t>?
    delete:
      confirm: <t:regular>Delete the land <t:entity_land><v:land></t>? This can't be undone.
    leave:
      confirm: <t:regular>Leave the land <t:entity_land><v:land></t>? The <t:regular_value><v:chunks></t> chunks you claimed may be unclaimed.
    unclaim:
      all:
        confirm: <t:regular>Unclaim all claims of the land <t:entity_land><v:land></t>?
    member:
      setowner:
        confirm: <t:regular>Make <t:regular_value><v:player></t> the new owner of the land <t:entity_land><v:land></t>?
    claim:
      merge:
        confirm: <t:regular>Merge the land <t:entity_land><v:merge></t> into <t:entity_land><v:land></t> for <t:cost><v:cost></t>?
    rental:
      buy:
        confirm: <t:regular>Buy the land <t:entity_land><v:land></t> for <t:cost><v:price></t>? Its members are untrusted once you bought it.
        confirm-land: <t:regular>Buy the land <t:entity_land><v:land></t> for <t:cost><v:price></t>?
        confirm-area: <t:regular>Buy the area <t:regular_value><v:area></t> of <t:entity_land><v:land></t> for <t:cost><v:price></t>?
      remove:
        tenant:
          confirm: <t:regular>Pay <t:cost><v:cost></t> as compensation to remove the tenant <t:regular_value><v:player></t>?
    nation:
      leave:
        confirm: <t:regular>Leave the nation <t:entity_nation><v:nation></t> with the land <t:entity_land><v:land></t>?
    nations:
      delete:
        confirm: <t:regular>Delete the nation <t:entity_nation><v:nation></t>? This can't be undone.
      member:
        setcapital:
          confirm: <t:regular>Make the land <t:entity_land><v:land></t> the new capital of the nation <t:entity_nation><v:nation></t>?
      war:
        declare:
          confirm: <t:regular>Declare war against <v:defender><t:regular> as <v:attacker><t:regular>?
          shield:
            confirm: <t:regular>Declare war against <v:defender><t:regular>? This removes your war shield <t:decoration>(</t><t:time><v:shield></t> left<t:decoration>)</t> and leaves you attackable.
    war:
      declare:
        confirm: <t:regular>Declare war against <v:defender><t:regular> as <v:attacker><t:regular>?
        shield:
          confirm: <t:regular>Declare war against <v:defender><t:regular>? This removes your war shield <t:decoration>(</t><t:time><v:shield></t> left<t:decoration>)</t> and leaves you attackable.
      independence:
        confirm: <t:regular>Declare independence from the nation <t:entity_nation><v:nation></t>? The land <t:entity_land><v:land></t> leaves it and a war against it starts.
    admin:
      database:
        restore:
          confirm: <t:negative>Erase all current Lands data and replace it with the selected backup?</t> <t:regular>Anything saved since that backup was taken is lost. The server restarts right after the restore. If your restart script isn't set up, start it again yourself.
      limits:
        migrate:
          confirm: '<t:negative>Migrate the old limit permissions to the limit packs?</t> <t:regular>Configure all limit packs in <v:file> first: the difference between a numbered permission and its pack is calculated from them. Take a backup of your database to be able to revert it.'
      land:
        addrole:
          confirm: <t:negative>Add this role?</t> <t:regular>Lands that already have it, for example new lands that got it from roles.yml, then have it twice. Running this again for the same role adds it again.
