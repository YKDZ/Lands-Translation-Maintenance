# In this file you can edit/add default land and nation levels.
# Please note that each config section (level section) name and level name must be unique.
# You must insert valid YAML format. To verify your format, you can paste the content of this file here: https://yaml-online-parser.appspot.com

# Default land and nation levels. You can also add your own levels.
# The order of the levels is ascending (lowest level -> highest).
# This file can not be reloaded via /lands reload.

general:
  # If enabled, lands and nations won't downgrade, if they no longer meet their current level requirements.
  farm-multipliers:
    crop-growth: true
    spawner-rate: true
    mob-xp: true
    mob-drops: true

land:
  # Enable land levels?
  enabled: true
  # Here you can edit existing or add new levels.
  levels:
    settlement:
      commands: []
      cost: 0
    hamlet:
      commands: []
      cost: 2000
      requirements:
        chunks:
          required: 4
        members:
          required: 2
      rewards:
        chunks:
          value: 2
        members:
          value: 1
    village:
      commands: []
      cost: 5000
      requirements:
        level_held:
          required: 1d
        members:
          required: 3
        playtime:
          required: 10h
          trusted-for: 7d
      rewards:
        chunks:
          value: 3
        members:
          value: 1
        unlock:
          value:
            - public_spawn
    town:
      commands: []
      cost: 12000
      requirements:
        level_held:
          required: 2d
        members:
          required: 5
        tenure:
          required: 3
          trusted-for: 3d
      rewards:
        areas:
          value: 1
        chunks:
          value: 4
        members:
          value: 2
        unlock:
          value:
            - storage
    borough:
      commands: []
      cost: 25000
      requirements:
        level_held:
          required: 3d
        members:
          required: 7
        playtime:
          required: 50h
          trusted-for: 7d
      rewards:
        chunks:
          value: 5
        crop_growth:
          value: 10
        members:
          value: 2
        upkeep:
          value: -5
    city:
      commands: []
      cost: 50000
      requirements:
        level_held:
          required: 4d
        members:
          required: 10
        tenure:
          required: 6
          trusted-for: 7d
      rewards:
        areas:
          value: 1
        chunks:
          value: 6
        members:
          value: 2
        mob_xp:
          value: 10
        unlock:
          value:
            - rentals
    metropolis:
      commands: []
      cost: 100000
      requirements:
        level_held:
          required: 5d
        members:
          required: 13
        playtime:
          required: 200h
          trusted-for: 7d
      rewards:
        chunks:
          value: 8
        members:
          value: 3
        spawner_rate:
          value: 10
        upkeep:
          value: -5
        war_shield:
          value: 6h
    province:
      commands: []
      cost: 200000
      requirements:
        level_held:
          required: 7d
        members:
          required: 16
        tenure:
          required: 10
          trusted-for: 14d
      rewards:
        chunks:
          value: 10
        crop_growth:
          value: 10
        members:
          value: 3
        mob_drops:
          value: 10
    duchy:
      commands: []
      cost: 400000
      requirements:
        level_held:
          required: 7d
        members:
          required: 20
        playtime:
          required: 500h
          trusted-for: 7d
      rewards:
        chunks:
          value: 12
        members:
          value: 4
        upkeep:
          value: -10
    kingdom:
      announce: true
      commands: []
      cost: 800000
      requirements:
        level_held:
          required: 10d
        members:
          required: 25
        tenure:
          required: 18
          trusted-for: 30d
      rewards:
        chunks:
          value: 15
        members:
          value: 5
        war_shield:
          value: 12h

nation:
  # Enable nation levels?
  enabled: true
  # Here you can edit existing or add new nation levels.
  levels:
    federation:
      commands: []
      cost: 0
    alliance:
      commands: []
      cost: 50000
      requirements:
        age:
          required: 3d
        lands:
          required: 2
        members:
          required: 15
      rewards:
        chunks:
          value: 5
        upkeep:
          value: -5
    nation:
      commands: []
      cost: 150000
      requirements:
        lands:
          required: 4
        level_held:
          required: 3d
        members:
          required: 30
      rewards:
        chunks:
          value: 10
        effects:
          value:
            - JUMP_BOOST
            - SPEED
            - HASTE
            - DOLPHINS_GRACE
        effects_amount:
          value: 1
        lands:
          value: 1
    empire:
      commands: []
      cost: 400000
      requirements:
        lands:
          required: 6
        level_held:
          required: 7d
        members:
          required: 50
      rewards:
        chunks:
          value: 15
        effects:
          value:
            - JUMP_BOOST:2
            - SPEED:2
            - HASTE:2
            - DOLPHINS_GRACE:2
            - NIGHT_VISION
            - LUCK
            - HEALTH_BOOST
        effects_amount:
          value: 2
        lands:
          value: 1
        upkeep:
          value: -10
    dominion:
      announce: true
      commands: []
      cost: 1000000
      requirements:
        lands:
          required: 10
        level_held:
          required: 14d
        members:
          required: 80
      rewards:
        chunks:
          value: 20
        lands:
          value: 2
        war_shield:
          value: 12h
  land-time: 7d

# You can disable sounds by setting them to ''
sound:
  # Played to each player of the land or nation on level up.
  up: 'block.bell.use'
  # Played to each player of the land or nation on level down.
  down: 'block.anvil.destroy'
