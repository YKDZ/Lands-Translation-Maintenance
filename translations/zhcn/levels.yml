# In this file you can edit/add default land and nation levels.
# Please note that each config section (level section) name and level name must be unique.
# You must insert valid YAML format. To verify your format, you can paste the content of this file here: https://yaml-online-parser.appspot.com

# Default land and nation levels. You can also add your own levels.
# The order of the levels is ascending (lowest level -> highest).
# This file can not be reloaded via /lands reload.

general:
  # If enabled, lands and nations won't downgrade, if they no longer meet their current level requirements.
  keep-level: false

land:
  # Enable land levels?
  enabled: true
  # Here you can edit existing or add new levels.
  levels:
    "1":
      # Set the name of the level.
      title: '据点'
      # These values are only active if the land isn't a member of any nation.
      # Attributes of a level will apply on top of whatever the current value for the land or nation is.
      attributes:
        # The chunks attribute will add or remove (= negative value) chunks to the land. That means that the land can claim more (or less) chunks at /claim.
        chunks:
          description: '<t:regular><v:value> claims</t>'
          value: 0
        members:
          description: '<t:regular><v:value> members</t>'
          value: 0
        # The upkeep attribute will higher or lower (= negative value) their upkeep costs by a given value.
        # This attribute is not active, if the land is part of a nation.
        upkeep:
          description: '<t:regular><v:value>% upkeep cost</t>'
          # The increase or decrease is in percent. So setting this value to 5 will increate the upkeep by 5 percent in total (not per chunk).
          value: 0
    "2":
      title: '村落'
      requirements:
        # Required members to get this level assigned.
        members:
          required: 4
          title: 'Trust <v:req> Players'
          description:
            - <t:regular>Trust <v:req> players in this land.
            - "<t:regular>Command: <t:cmd>/lands trust"
        # Required chunks to get this level assigned.
        chunks:
          required: 0
          title: 'Claim <v:req> Chunks'
          description:
            - <t:regular>Claim <v:req> chunks for this land.
            - "<t:regular>Command: <t:cmd>/claim"
        # Required bank balance to get this level assigned (/lands balance).
        balance:
          required: 7500
          title: 'Balance of $<v:req>'
          description:
            - <t:regular>Have $<v:req> deposited into this land bank.
            - "<t:regular>Command: <t:cmd>/lands deposit"
        # Plugin: https://www.spigotmc.org/resources/67627
        betterfarming:
          farms:
            required: 1
            title: '<v:req> Upgradeable Farm'
            description:
              - <t:regular>Have <v:req> upgradeable farm in your land.
              - "<t:regular>Command: <t:cmd>/farm get"
        # Plugin: https://www.spigotmc.org/resources/69201
        upgradeablehoppers:
          hoppers:
            required: 5
            title: '<v:req> Upgradeable Hoppers'
            description:
              - <t:regular>Have <v:req> upgradeable hoppers in your land.
              - "<t:regular>Command: <t:cmd>/hopper get"
        # Plugin: https://www.spigotmc.org/resources/77717
        upgradeablespawners:
          spawners:
            required: 3
            title: '<v:req> Upgradeable Spawners'
            description:
              - <t:regular>Have <v:req> upgradeable spawners in your land.
              - "<t:regular>Command: <t:cmd>/spawner get"
      attributes:
        chunks:
          description: '<t:regular><v:value> claims</t>'
          value: 1
        members:
          description: '<t:regular><v:value> members</t>'
          value: 1
        upkeep:
          description: '<t:regular><v:value>% upkeep cost</t>'
          value: 5
      # Execute console commands, if the land reaches this level or gets downgraded from this level to the previous one.
      # Available placeholders:
      # {level}: Name of the level
      # {land}: Parameter name of the land = without spaces.
      # {land_name}: Name of the land. Might contain spaces.
      # {owner}: The player name of the land owner.
      # {member}: The player name a land member.
      # If the command contains the {member} placeholder, the command will be executed for each player that is trusted in the land.
      commands:
        # When a land reaches this level.
        reached: []
        # When a land gets downgraded from the next level to this one.
        down: []
    "3":
      title: '城市'
      requirements:
        members:
          required: 8
          title: 'Trust <v:req> Players'
          description:
            - <t:regular>Trust <v:req> players in this land.
            - "<t:regular>Command: <t:cmd>/lands trust"
        chunks:
          required: 0
          title: 'Claim <v:req> Chunks'
          description:
            - <t:regular>Claim <v:req> chunks for this land.
            - "<t:regular>Command: <t:cmd>/claim"
        balance:
          required: 17000
          title: 'Balance of $<v:req>'
          description:
            - <t:regular>Have $<v:req> deposited into this land bank.
            - "<t:regular>Command: <t:cmd>/lands deposit"
        # Plugin: https://www.spigotmc.org/resources/67627
        betterfarming:
          farms:
            required: 3
            title: '<v:req> Upgradeable Farms'
            description:
              - <t:regular>Have <v:req> upgradeable farms in your land.
              - "<t:regular>Command: <t:cmd>/farm get"
        # Plugin: https://www.spigotmc.org/resources/69201
        upgradeablehoppers:
          hoppers:
            required: 8
            title: '<v:req> Upgradeable Hoppers'
            description:
              - <t:regular>Have <v:req> upgradeable hoppers in your land.
              - "<t:regular>Command: <t:cmd>/hopper get"
        # Plugin: https://www.spigotmc.org/resources/77717
        upgradeablespawners:
          spawners:
            required: 3
            title: '<v:req> Upgradeable Spawners'
            description:
              - <t:regular>Have <v:req> upgradeable spawners in your land.
              - "<t:regular>Command: <t:cmd>/spawner get"
      attributes:
        chunks:
          description: '<t:regular><v:value> claims</t>'
          value: 2
        members:
          description: '<t:regular><v:value> members</t>'
          value: 2
        upkeep:
          description: '<t:regular><v:value>% upkeep cost</t>'
          value: 10
      commands:
        reached: []
        down: []
    "4":
      title: '省区'
      requirements:
        members:
          required: 14
          title: 'Trust <v:req> Players'
          description:
            - <t:regular>Trust <v:req> players in this land.
            - "<t:regular>Command: <t:cmd>/lands trust"
        chunks:
          required: 0
          title: 'Claim <v:req> Chunks'
          description:
            - <t:regular>Claim <v:req> chunks for this land.
            - "<t:regular>Command: <t:cmd>/claim"
        balance:
          required: 30000
          title: 'Balance of $<v:req>'
          description:
            - <t:regular>Have $<v:req> deposited into this land bank.
            - "<t:regular>Command: <t:cmd>/lands deposit"
        # Plugin: https://www.spigotmc.org/resources/67627
        betterfarming:
          farms:
            required: 5
            title: '<v:req> Upgradeable Farms'
            description:
              - <t:regular>Have <v:req> upgradeable farms in your land.
              - "<t:regular>Command: <t:cmd>/farm get"
        # Plugin: https://www.spigotmc.org/resources/69201
        upgradeablehoppers:
          hoppers:
            required: 15
            title: '<v:req> Upgradeable Hoppers'
            description:
              - <t:regular>Have <v:req> upgradeable hoppers in your land.
              - "<t:regular>Command: <t:cmd>/hopper get"
        # Plugin: https://www.spigotmc.org/resources/77717
        upgradeablespawners:
          spawners:
            required: 5
            title: '<v:req> Upgradeable Spawners'
            description:
              - <t:regular>Have <v:req> upgradeable spawners in your land.
              - "<t:regular>Command: <t:cmd>/spawner get"
      attributes:
        chunks:
          description: '<t:regular><v:value> claims</t>'
          value: 4
        members:
          description: '<t:regular><v:value> members</t>'
          value: 3
        upkeep:
          description: '<t:regular><v:value>% upkeep cost</t>'
          value: 25
      commands:
        reached: []
        down: []
    "5":
      title: '市区'
      requirements:
        members:
          required: 24
          title: 'Trust <v:req> Players'
          description:
            - <t:regular>Trust <v:req> players in this land.
            - "<t:regular>Command: <t:cmd>/lands trust"
        chunks:
          required: 0
          title: 'Claim <v:req> Chunks'
          description:
            - <t:regular>Claim <v:req> chunks for this land.
            - "<t:regular>Command: <t:cmd>/claim"
        balance:
          required: 55000
          title: 'Balance of $<v:req>'
          description:
            - <t:regular>Have $<v:req> deposited into this land bank.
            - "<t:regular>Command: <t:cmd>/lands deposit"
        # Plugin: https://www.spigotmc.org/resources/67627
        betterfarming:
          farms:
            required: 6
            title: '<v:req> Upgradeable Farms'
            description:
              - <t:regular>Have <v:req> upgradeable farms in your land.
              - "<t:regular>Command: <t:cmd>/farm get"
        # Plugin: https://www.spigotmc.org/resources/69201
        upgradeablehoppers:
          hoppers:
            required: 25
            title: '<v:req> Upgradeable Hoppers'
            description:
              - <t:regular>Have <v:req> upgradeable hoppers in your land.
              - "<t:regular>Command: <t:cmd>/hopper get"
        # Plugin: https://www.spigotmc.org/resources/77717
        upgradeablespawners:
          spawners:
            required: 6
            title: '<v:req> Upgradeable Spawners'
            description:
              - <t:regular>Have <v:req> upgradeable spawners in your land.
              - "<t:regular>Command: <t:cmd>/spawner get"
      attributes:
        chunks:
          description: '<t:regular><v:value> claims</t>'
          value: 8
        members:
          description: '<t:regular><v:value> members</t>'
          value: 4
        upkeep:
          description: '<t:regular><v:value>% upkeep cost</t>'
          value: 30
      commands:
        reached: []
        down: []

nation:
  # Enable nation levels?
  enabled: true
  # Here you can edit existing or add new nation levels.
  levels:
    "1":
      # Set the name of the level.
      title: '联邦'
      # For the entry level, there are not attributes set. But you could add them anyways, if you modify the value options.
      # Attributes of a level will apply on top of whatever the current value for the land or nation is.
      attributes:
        chunks:
          description: '<t:regular><v:value> claims</t>'
          value: 0
        lands:
          description: '<t:regular><v:value> lands</t>'
          value: 0
        upkeep:
          description: '<t:regular><v:value>% upkeep cost</t>'
          value: 0
        effects:
          description: '<t:positive>+ Unlock effects: <v:value></t>'
          value: []
        effects_amount:
          description: '<t:positive>+ Have <v:value> effects active at once</t>'
          value: 0
    "2":
      title: '国家'
      requirements:
        # Required minimum amount of unique lands in the nation.
        # This does not include the capital land.
        lands:
          required: 3
          title: '<v:req> Lands'
          description:
            - <t:regular>Invite <v:req> lands to join your nation
            - <t:regular>and let them accept your invite.
            - "<t:regular>Command: <t:cmd>/nation trust"
        # Required members (total unique players) to get this level assigned.
        members:
          required: 32
          title: '<v:req> unique Players'
          description:
            - <t:regular>Have <v:req> players trusted in total.
            - "<t:regular>Command: <t:cmd>/lands trust"
        # Required total chunks to get this level assigned.
        chunks:
          required: 0
          title: 'Claim <v:req> Chunks'
          description:
            - <t:regular>Have <v:req> claims in total.
            - "<t:regular>Command: <t:cmd>/claim"
        # Required total balance (the balance of all lands) to get this level assigned.
        balance:
          required: 100000
          title: 'Balance of $<v:req>'
          description:
            - <t:regular>Have $<v:req> deposited across all lands.
            - "<t:regular>Command: <t:cmd>/lands deposit"
        # Plugin: https://www.spigotmc.org/resources/67627
        betterfarming:
          farms:
            required: 9
            title: '<v:req> Upgradeable Farms'
            description:
              - <t:regular>Have <v:req> upgradeable farms in your land.
              - "<t:regular>Command: <t:cmd>/farm get"
        # Plugin: https://www.spigotmc.org/resources/69201
        upgradeablehoppers:
          hoppers:
            required: 24
            title: '<v:req> Upgradeable Hoppers'
            description:
              - <t:regular>Have <v:req> upgradeable hoppers in your land.
              - "<t:regular>Command: <t:cmd>/hopper get"
        # Plugin: https://www.spigotmc.org/resources/77717
        upgradeablespawners:
          spawners:
            required: 9
            title: '<v:req> Upgradeable Spawners'
            description:
              - <t:regular>Have <v:req> upgradeable spawners in your land.
              - "<t:regular>Command: <t:cmd>/spawner get"
      attributes:
        # Give each land of the nation x amount of additional chunks.
        chunks:
          description: '<t:regular><v:value> claims</t>'
          value: 20
        lands:
          description: '<t:regular><v:value> lands</t>'
          value: 1
        # Modify upkeep by x percent. This also supports negative values.
        # The nation pays the upkeep to the server.
        upkeep:
          description: '<t:regular><v:value>% upkeep cost</t>'
          value: 20
        # Allow nations to activate a specific amount of effects in their nation. Effects can be unlocked through level progression.
        effects:
          description: '<t:positive>+ Unlock effects: <v:value></t>'
          # Configure a list of unlocked effects for this level. Valid effects: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/potion/PotionEffectType.html
          # Format: EFFECT:AMPLIFIER
          # The amiplifier is the strength (level) of the effect. Example: JUMP:2 -> Jump II
          value:
            - JUMP
            - SPEED
            - FAST_DIGGING
            - DOLPHINS_GRACE
        # Modify how many effects can be active at the same time.
        effects_amount:
          description: '<t:positive>+ Have <v:value> effects active at once</t>'
          value: 1
      # Execute console commands, if the nation reaches this level or gets downgraded from this level to the previous one.
      # Available placeholders:
      # {level}: Name of the level
      # {nation}: Name of the nation
      # {owner}: The player name of nation owner.
      # {land}: Parameter name of the land that is part of the nation. Doesn't contain spaces.
      # {land_name}: Name of the land that is part of the nation. May contain spaces.
      # If the command contains the {land} placeholder, the command will be executed for each land, which is part of the nation.
      commands:
        # When a nation reaches this level.
        reached: []
        # When a nation gets downgraded from the next level to this one.
        down: []
    "3":
      title: '帝国'
      requirements:
        lands:
          required: 6
          title: '<v:req> Lands'
          description:
            - <t:regular>Invite <v:req> lands to join your nation
            - <t:regular>and let them accept your invite.
            - "<t:regular>Command: <t:cmd>/nations trust"
        members:
          required: 64
          title: '<v:req> unique Players'
          description:
            - <t:regular>Have <v:req> players trusted in total.
            - "<t:regular>Command: <t:cmd>/lands trust"
        chunks:
          required: 0
          title: 'Claim <v:req> Chunks'
          description:
            - <t:regular>Have <v:req> claims in total.
            - "<t:regular>Command: <t:cmd>/claim"
        balance:
          required: 250000
          title: 'Balance of $<v:req>'
          description:
            - <t:regular>Have $<v:req> deposited across all lands.
            - "<t:regular>Command: <t:cmd>/lands deposit"
        # Plugin: https://www.spigotmc.org/resources/67627
        betterfarming:
          farms:
            required: 18
            title: '<v:req> Upgradeable Farms'
            description:
              - <t:regular>Have <v:req> upgradeable farms in your land.
              - "<t:regular>Command: <t:cmd>/farm get"
        # Plugin: https://www.spigotmc.org/resources/69201
        upgradeablehoppers:
          hoppers:
            required: 30
            title: '<v:req> Upgradeable Hoppers'
            description:
              - <t:regular>Have <v:req> upgradeable hoppers in your land.
              - "<t:regular>Command: <t:cmd>/hopper get"
        # Plugin: https://www.spigotmc.org/resources/77717
        upgradeablespawners:
          spawners:
            required: 18
            title: '<v:req> Upgradeable Spawners'
            description:
              - <t:regular>Have <v:req> upgradeable spawners in your land.
              - "<t:regular>Command: <t:cmd>/spawner get"
      attributes:
        chunks:
          description: '<t:regular><v:value> claims</t>'
          value: 35
        lands:
          description: '<t:regular><v:value> lands</t>'
          value: 3
        upkeep:
          description: '<t:regular><v:value>% upkeep cost</t>'
          value: 35
        effects:
          description: '<t:positive>+ Unlock effects: <v:value></t>'
          value:
            - JUMP:2
            - SPEED:2
            - FAST_DIGGING:2
            - DOLPHINS_GRACE:2
            - ABSORPTION
            - NIGHT_VISION
            - LUCK
            - INCREASE_DAMAGE
            - HEALTH_BOOST
        effects_amount:
          description: '<t:positive>+ Have <v:value> effects active at once</t>'
          value: 3
      commands:
        reached: []
        down: []

# You can disable sounds by setting them to ''
sound:
  # Played to each player of the land or nation on level up.
  up: 'block.bell.use'
  # Played to each player of the land or nation on level down.
  down: 'block.anvil.destroy'
