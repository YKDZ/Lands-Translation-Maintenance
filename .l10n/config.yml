  - path: Locale/Wars/en-US.yml
    purpose: chat-language
  - path: Locale/Wars/en-US_gui.yml
    purpose: gui-language
translationScope:
  sourceLanguage: "en-US"
  targetLanguage: "zh-CN"
  mappings:
    - source: Locale/en-US.yml
      target: Locale/zh-CN.yml
      fields:
        - path: [general]
          category: chat-string
        - path: [help]
          category: chat-string
        - path: [lands]
          category: chat-string
        - path: [list, "**"]
          category: chat-string-list
    - source: Locale/Nations/en-US.yml
      target: Locale/Nations/zh-CN.yml
      fields:
        - path: [general]
          category: chat-string
        - path: [nations]
          category: chat-string
        - path: [help]
          category: chat-string
        - path: [lands]
          category: chat-string
    - source: Locale/Wars/en-US.yml
      target: Locale/Wars/zh-CN.yml
      fields:
        - path: [general]
          category: chat-string
        - path: [wars]
          category: chat-string
        - path: [help]
          category: chat-string
        - path: [lands]
          category: chat-string
        - path: [nations]
          category: chat-string
    - source: Locale/en-US_dialogs.yml
      target: Locale/zh-CN_dialogs.yml
      definitionsSource: Locale/en-US_dialogs.yml
      fields:
        - path: [dialogs, "*", title]
          category: dialog-string
          scene: dialog-title
        - path: [dialogs, "*", buttons, "*", label]
          category: dialog-string
          scene: dialog-button-label
        - path: [dialogs, "*", buttons, "*", tooltip]
          category: dialog-string
          scene: dialog-button-tooltip
        - path: [dialogs, "*", inputs, "*", label]
          category: dialog-string
          scene: dialog-input-label
        - path: [dialogs, "*", inputs, "*", label-format]
          category: dialog-label-format
          scene: dialog-label-format
        - path: [dialogs, "*", bodies, "*", text]
          category: dialog-string
          scene: dialog-body-text
        - path: [dialogs, "*", bodies, "*", item, name]
          category: gui-string
          scene: gui-item-name
        - path: [dialogs, "*", bodies, "*", item, lore]
          category: gui-lore
          scene: gui-item-lore
    - source: Locale/Nations/en-US_dialogs.yml
      target: Locale/Nations/zh-CN_dialogs.yml
      definitionsSource: Locale/Nations/en-US_dialogs.yml
      fields:
        - path: [dialogs, "*", title]
          category: dialog-string
          scene: dialog-title
        - path: [dialogs, "*", buttons, "*", label]
          category: dialog-string
          scene: dialog-button-label
        - path: [dialogs, "*", buttons, "*", tooltip]
          category: dialog-string
          scene: dialog-button-tooltip
        - path: [dialogs, "*", inputs, "*", label]
          category: dialog-string
          scene: dialog-input-label
        - path: [dialogs, "*", inputs, "*", label-format]
          category: dialog-label-format
          scene: dialog-label-format
        - path: [dialogs, "*", bodies, "*", text]
          category: dialog-string
          scene: dialog-body-text
        - path: [dialogs, "*", bodies, "*", item, name]
          category: gui-string
          scene: gui-item-name
        - path: [dialogs, "*", bodies, "*", item, lore]
          category: gui-lore
          scene: gui-item-lore
    - source: Locale/en-US_gui.yml
      target: Locale/zh-CN_gui.yml
      definitionsSource: Locale/definitions_gui.yml
      fields:
        - path: [general, "**"]
          category: gui-string
          scene: gui-general
        - path: [common, items, default, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [common, items, default, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [physical, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [physical, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [gui, "*", title]
          category: gui-string
          scene: gui-title
        - path: [gui, "*", items, "*", "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [gui, "*", items, "*", "*", lore]
          category: gui-lore
          scene: gui-item-lore
    - source: Locale/Nations/en-US_gui.yml
      target: Locale/Nations/zh-CN_gui.yml
      definitionsSource: Locale/Nations/definitions_gui.yml
      fields:
        - path: [general, "**"]
          category: gui-string
          scene: gui-general
        - path: [common, items, default, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [common, items, default, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [physical, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [physical, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [gui, "*", title]
          category: gui-string
          scene: gui-title
        - path: [gui, "*", items, "*", "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [gui, "*", items, "*", "*", lore]
          category: gui-lore
          scene: gui-item-lore
    - source: Locale/Wars/en-US_gui.yml
      target: Locale/Wars/zh-CN_gui.yml
      definitionsSource: Locale/Wars/definitions_gui.yml
      fields:
        - path: [general, "**"]
          category: gui-string
          scene: gui-general
        - path: [common, items, default, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [common, items, default, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [physical, "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [physical, "*", lore]
          category: gui-lore
          scene: gui-item-lore
        - path: [gui, "*", title]
          category: gui-string
          scene: gui-title
        - path: [gui, "*", items, "*", "*", name]
          category: gui-string
          scene: gui-item-name
        - path: [gui, "*", items, "*", "*", lore]
          category: gui-lore
          scene: gui-item-lore
    - source: categories.yml
      target: categories.yml
      definitionsSource: categories.yml
      fields:
        - path: [land, categories, "*", name]
          category: configuration-string
          scene: category-name
        - path: [land, categories, "*", description]
          category: configuration-string-list
          scene: category-description
