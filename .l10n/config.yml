  - path: Locale/definitions_gui.yml
    purpose: configuration
  - path: Locale/en-US.yml
    purpose: chat-language
  - path: Locale/en-US_dialogs.yml
    purpose: dialog-language
  - path: Locale/en-US_gui-bedrock.yml
