        - path: [land, levels, "*", requirements, betterfarming, farms, title]
          category: configuration-string
          scene: level-requirement-title
        - path: [land, levels, "*", requirements, betterfarming, farms, description]
          category: configuration-string-list
          scene: level-requirement-description
        - path: [land, levels, "*", requirements, upgradeablehoppers, hoppers, title]
          category: configuration-string
          scene: level-requirement-title
        - path: [land, levels, "*", requirements, upgradeablehoppers, hoppers, description]
          category: configuration-string-list
          scene: level-requirement-description
        - path: [land, levels, "*", requirements, upgradeablespawners, spawners, title]
          category: configuration-string
          scene: level-requirement-title
        - path: [land, levels, "*", requirements, upgradeablespawners, spawners, description]
          category: configuration-string-list
          scene: level-requirement-description
        - path: [nation, levels, "*", title]
          category: configuration-string
          scene: level-title
        - path: [nation, levels, "*", attributes, "*", description]
          category: configuration-string
          scene: level-attribute-description
        - path: [nation, levels, "*", requirements, "*", title]
          category: configuration-string
          scene: level-requirement-title
        - path: [nation, levels, "*", requirements, "*", description]
          category: configuration-string-list
          scene: level-requirement-description
        - path: [nation, levels, "*", requirements, betterfarming, farms, title]
          category: configuration-string
          scene: level-requirement-title
        - path: [nation, levels, "*", requirements, betterfarming, farms, description]
          category: configuration-string-list
          scene: level-requirement-description
        - path: [nation, levels, "*", requirements, upgradeablehoppers, hoppers, title]
          category: configuration-string
          scene: level-requirement-title
        - path: [nation, levels, "*", requirements, upgradeablehoppers, hoppers, description]
          category: configuration-string-list
          scene: level-requirement-description
        - path: [nation, levels, "*", requirements, upgradeablespawners, spawners, title]
          category: configuration-string
          scene: level-requirement-title
        - path: [nation, levels, "*", requirements, upgradeablespawners, spawners, description]
          category: configuration-string-list
          scene: level-requirement-description
    - source: roles.yml
      target: roles.yml
      definitionsSource: roles.yml
      fields:
        - path: [land, roles, "*", name]
          category: configuration-string
          scene: role-name
